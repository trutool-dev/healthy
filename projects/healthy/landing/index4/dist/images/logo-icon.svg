<svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!--
    Healthy — logo icon 48×48
    Hoja botánica minimalista: dos arcos cuadráticos se encuentran
    en el ápice superior y en la base, formando una hoja puntiaguda.
    La vena central está ligeramente desplazada para añadir naturalidad
    sin romper la simetría visual del icono.
  -->

  <!-- Cuerpo de la hoja -->
  <path
    d="M24 5 Q39 24 24 43 Q9 24 24 5 Z"
    fill="#22C55E"
  />

  <!-- Vena central — sutil, ligeramente orgánica -->
  <path
    d="M24 43 C23.6 33 23.2 19 24 5"
    stroke="#16A34A"
    stroke-width="1.5"
    stroke-linecap="round"
    fill="none"
  />
</svg>
