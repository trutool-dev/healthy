services:
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: healthy-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-healthy}:${POSTGRES_PASSWORD:-healthy_pass}@postgres:5432/${POSTGRES_DB:-healthy_db}
      REDIS_URL: redis://redis:6379
    env_file:
      - ../.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - healthy-net
    volumes:
      - ../backend:/app
      - /app/node_modules

  postgres:
    image: postgres:16-alpine
    container_name: healthy-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-healthy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-healthy_pass}
      POSTGRES_DB: ${POSTGRES_DB:-healthy_db}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-healthy} -d ${POSTGRES_DB:-healthy_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - healthy-net

  redis:
    image: redis:7-alpine
    container_name: healthy-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - healthy-net

volumes:
  postgres-data:
  redis-data:

networks:
  healthy-net:
    driver: bridge
