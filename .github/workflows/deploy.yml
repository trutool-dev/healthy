name: Deploy

on:
  push:
    branches:
      - main      # → producción
      - develop   # → staging

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false  # nunca cancelar un deploy en curso

env:
  AWS_REGION: eu-west-1
  ECR_REPOSITORY: healthy-backend
  IMAGE_TAG: ${{ github.sha }}

jobs:
  # ── Build y push a ECR ───────────────────────────────────────────────────────
  build-push:
    name: Build + Push ECR
    runs-on: ubuntu-latest

    outputs:
      image: ${{ steps.build.outputs.image }}

    steps:
      - uses: actions/checkout@v4

      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login a Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build y push imagen
        id: build
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}
            ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.ref_name == 'main' && 'latest' || 'staging' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Exportar nombre de imagen
        run: echo "image=${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}" >> $GITHUB_OUTPUT
        id: export  # alias para el output del job

  # ── Deploy a staging (develop → staging) ────────────────────────────────────
  deploy-staging:
    name: Deploy → Staging
    runs-on: ubuntu-latest
    needs: build-push
    if: github.ref_name == 'develop'
    environment: staging

    steps:
      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Actualizar servicio ECS staging
        run: |
          aws ecs update-service \
            --cluster healthy-staging \
            --service healthy-backend \
            --force-new-deployment \
            --region ${{ env.AWS_REGION }}

      - name: Esperar despliegue estable
        run: |
          aws ecs wait services-stable \
            --cluster healthy-staging \
            --services healthy-backend \
            --region ${{ env.AWS_REGION }}

  # ── Deploy a producción (main → production) ──────────────────────────────────
  deploy-production:
    name: Deploy → Production
    runs-on: ubuntu-latest
    needs: build-push
    if: github.ref_name == 'main'
    environment: production  # requiere aprobación manual en GitHub

    steps:
      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Actualizar servicio ECS producción
        run: |
          aws ecs update-service \
            --cluster healthy-production \
            --service healthy-backend \
            --force-new-deployment \
            --region ${{ env.AWS_REGION }}

      - name: Esperar despliegue estable
        run: |
          aws ecs wait services-stable \
            --cluster healthy-production \
            --services healthy-backend \
            --region ${{ env.AWS_REGION }}

      - name: Notificar despliegue exitoso
        if: success()
        run: |
          echo "Despliegue a producción completado: ${{ env.IMAGE_TAG }}"
